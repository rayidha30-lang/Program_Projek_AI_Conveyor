<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7e4bf7" />
      <stop offset="50%" stop-color="#6732ea" />
      <stop offset="100%" stop-color="#4e1fd9" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Chip Connector Pins -->
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <!-- Top Pins -->
    <line x1="25" y1="11" x2="25" y2="16" />
    <line x1="32" y1="10" x2="32" y2="16" />
    <line x1="39" y1="11" x2="39" y2="16" />
    <!-- Bottom Pins -->
    <line x1="25" y1="48" x2="25" y2="53" />
    <line x1="32" y1="48" x2="32" y2="54" />
    <line x1="39" y1="48" x2="39" y2="53" />
    <!-- Left Pins -->
    <line x1="11" y1="25" x2="16" y2="25" />
    <line x1="10" y1="32" x2="16" y2="32" />
    <line x1="11" y1="39" x2="16" y2="39" />
    <!-- Right Pins -->
    <line x1="48" y1="25" x2="53" y2="25" />
    <line x1="48" y1="32" x2="54" y2="32" />
    <line x1="48" y1="39" x2="53" y2="39" />
  </g>

  <!-- Main Chip Body -->
  <rect x="16" y="16" width="32" height="32" rx="8" fill="#ffffff" filter="url(#glow)" />

  <!-- Inner Chip Core / Sensor Aperture -->
  <rect x="21" y="21" width="22" height="22" rx="5" fill="#1e1045" />

  <!-- Optical Camera Eye / Lens Sensor -->
  <circle cx="32" cy="32" r="7" fill="url(#coreGrad)" />
  <circle cx="32" cy="32" r="3.2" fill="#ffffff" />
  
  <!-- Optical Crosshair Marks -->
  <circle cx="32" cy="32" r="9.5" stroke="#00f5d4" stroke-width="1" stroke-dasharray="2 2" opacity="0.8" />
  
  <!-- Live Detection Status Indicator -->
  <circle cx="43" cy="21" r="2.5" fill="#10b981" />
</svg>
